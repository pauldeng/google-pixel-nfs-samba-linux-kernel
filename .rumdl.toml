line-length = 160
flavor = "gfm"
respect-gitignore = true
cache-dir = ".tools/cache/rumdl"
# Technical evidence tables, immutable hashes, and source URLs are intentionally
# not hard-wrapped. All other default lint rules remain enabled.
disable = ["MD013"]

[per-file-ignores]
"docs/action-plan.md" = ["MD025"]
